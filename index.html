<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yashi &amp; Siddhant — Wedding Invitation</title>
  <meta name="description" content="Save the date — Yashi &amp; Siddhant are getting married." />
  <meta property="og:title" content="Yashi &amp; Siddhant — Save The Date" />
  <meta property="og:description" content="You are warmly invited to celebrate our wedding." />
  <meta property="og:image" content="assets/card.jpg" />
  <meta name="theme-color" content="#0b0907" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="locked">

  <!-- ========== ENVELOPE INTRO ========== -->
  <div class="intro" id="intro">
    <!-- src/poster are chosen in script.js: portrait version on phones, landscape on wider screens -->
    <video id="intro-video" playsinline preload="auto"></video>
    <button class="open-btn" id="open-btn" aria-label="Open the invitation">
      <span class="ring"></span>
      <span class="label">Tap to Open</span>
    </button>
    <button class="skip-btn" id="skip-btn" hidden>Skip ›</button>
  </div>

  <!-- ========== HERO ========== -->
  <header class="hero" id="top">
    <div class="frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>

      <p class="blessing" data-field="blessing"></p>
      <p class="kicker">Save The Date</p>
      <div class="flourish" aria-hidden="true"></div>
      <h1 class="names">
        <span data-field="bride"></span>
        <span class="amp">&amp;</span>
        <span data-field="groom"></span>
      </h1>
      <div class="flourish" aria-hidden="true"></div>
      <p class="date" data-field="dateText"></p>
      <p class="place" data-field="cityText"></p>
    </div>

    <div class="countdown" id="countdown" aria-live="polite">
      <div><span id="cd-days">0</span><small>Days</small></div>
      <div><span id="cd-hours">00</span><small>Hours</small></div>
      <div><span id="cd-mins">00</span><small>Minutes</small></div>
      <div><span id="cd-secs">00</span><small>Seconds</small></div>
    </div>

    <a href="#invite" class="scroll-cue" aria-label="Scroll down">
      <span></span>
    </a>
  </header>

  <!-- ========== INVITATION TEXT ========== -->
  <section class="section reveal" id="invite">
    <div class="paper">
      <p class="script-sm">With the blessings of the Almighty</p>
      <p class="muted">and our beloved elders</p>
      <p class="families"><span data-field="brideParents"></span></p>
      <p class="muted">cordially invite you to the wedding of their daughter</p>
      <h2 class="script-lg" data-field="bride"></h2>
      <p class="muted">with</p>
      <h2 class="script-lg" data-field="groom"></h2>
      <p class="muted">son of</p>
      <p class="families"><span data-field="groomParents"></span></p>
    </div>
  </section>

  <!-- ========== EVENTS ========== -->
  <section class="section reveal" id="events">
    <h2 class="title">Wedding Festivities</h2>
    <div class="ornament" aria-hidden="true">❦</div>
    <div class="events" id="event-list"></div>
  </section>

  <!-- ========== RSVP ========== -->
  <section class="section reveal" id="rsvp">
    <h2 class="title">Kindly RSVP</h2>
    <div class="ornament" aria-hidden="true">❦</div>
    <p class="lead">Your presence is the greatest gift. Please let us know by <strong data-field="rsvpBy"></strong>.</p>
    <form id="rsvp-form" class="rsvp">
      <label>Your name
        <input name="name" required autocomplete="name" />
      </label>
      <label>Number of guests
        <input name="guests" type="number" min="1" max="10" value="1" required />
      </label>
      <label>Will you attend?
        <select name="attending">
          <option>Joyfully accept</option>
          <option>Regretfully decline</option>
        </select>
      </label>
      <label>Blessings for the couple (optional)
        <textarea name="message" rows="3"></textarea>
      </label>
      <button type="submit" class="btn">Send RSVP on WhatsApp</button>
    </form>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <p class="monogram" data-field="monogram"></p>
    <p class="hashtag" data-field="hashtag"></p>
    <p>With love, <span data-field="familyName"></span></p>
    <p class="contact" id="contact"></p>
    <button class="replay" id="replay">↺ Watch the invitation again</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
